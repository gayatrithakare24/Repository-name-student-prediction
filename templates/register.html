<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow-lg" style="width: 350px;">

    <h3 class="text-center mb-3">Register</h3>

    <!-- Error Message -->
    {% if msg %}
    <div class="alert alert-danger text-center">
        {{msg}}
    </div>
    {% endif %}

    <form method="POST">

        <input class="form-control mb-3" name="username" placeholder="Username" required>

        <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>

        <select class="form-control mb-3" name="section" required>
            <option value="">Select Section</option>
            <option value="A">Section A</option>
            <option value="B">Section B</option>
            <option value="C">Section C</option>
        </select>

        <!-- Security Question -->
        <select class="form-control mb-3" name="question" required>
            <option value="">Select Security Question</option>
            <option>What is your pet name?</option>
            <option>What is your school name?</option>
            <option>What is your favourite teacher name?</option>
        </select>

        <!-- Answer -->
        <input class="form-control mb-3" name="answer" placeholder="Your Answer" required>

        <button class="btn btn-success w-100">Register</button>
    </form>

    <p class="text-center mt-3">
        <a href="/">Already have account? Login</a>
    </p>

</div>

</body>
</html>
